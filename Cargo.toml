[workspace]
resolver = "3"
members = ["src-tauri", "crates/poe-core"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Opoz/poe-overlay"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
