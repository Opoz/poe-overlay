[package]
name = "poe-overlay"
version = "0.1.0"
description = "Path of Exile levelling companion"
authors = ["Opoz"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519)
name = "poe_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
poe-core = { path = "../crates/poe-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
