[package]
name = "poe-overlay"
version = "0.1.0"
description = "Path of Exile levelling companion"
authors = ["Opoz"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519)
name = "poe_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
poe-core = { path = "../crates/poe-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.2.1"
chrono = "0.4.45"
tauri-plugin-global-shortcut = "2.4.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
ureq = "3.5.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
