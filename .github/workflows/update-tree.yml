name: Update passive and atlas trees

# GGG updates the skill tree export around league launches and patches.
# Every Thursday, regenerate tree.json and atlas.json; if either changed and
# the tests still
# pass, open a PR into dev.
on:
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-tree.mjs
      - run: node scripts/gen-atlas.mjs

      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- crates/poe-core/data/tree.json crates/poe-core/data/atlas.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # PRs opened with GITHUB_TOKEN don't trigger CI, so test here first.
      - if: steps.diff.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.diff.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.diff.outputs.changed == 'true'
        run: cargo test -p poe-core

      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: bot/update-tree
          add-paths: |
            crates/poe-core/data/tree.json
            crates/poe-core/data/atlas.json
          commit-message: Update passive and atlas tree data from GGG exports
          title: Update passive and atlas tree data
          body: |
            GGG's skill tree or atlas tree export (or RePoE's passive id map)
            changed, so `crates/poe-core/data/tree.json` / `atlas.json` were
            regenerated with `scripts/gen-tree.mjs` / `gen-atlas.mjs`.
            `cargo test -p poe-core` passed.

            Check the tree overlay in-game after merging if a new league
            moved nodes around.
          delete-branch: true
