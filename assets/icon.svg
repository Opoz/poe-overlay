      <stop offset="0" stop-color="#1f2528"/>
      <stop offset="1" stop-color="#111416"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="#2d3539" stroke-width="12"/>
  <path d="M512 150 874 512 512 874 150 512Z" fill="none" stroke="#d9ae62" stroke-width="64" stroke-linejoin="round"/>
  <path d="M350 584 456 490l96 82 96-120" fill="none" stroke="#ede6d6" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="648" cy="452" r="60" fill="#d9ae62"/>
